[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "poker-tracker"
version = "0.1.0"
description = "Local poker hand ingestion and analysis"
requires-python = ">=3.12"
dependencies = ["duckdb==1.5.5"]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/poker_tracker"]
